<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="190" viewBox="0 0 1280 190" role="img" aria-labelledby="title"><title id="title">From input to application</title><rect x="1" y="1" width="1278" height="188" rx="20" fill="#F6F8FF" stroke="#D1D9EE"/><rect x="27" y="27" width="278" height="133" rx="12" fill="#FFFFFF" stroke="#D1D9EE"/><text x="45" y="62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#10172E" text-anchor="start">Input</text><text x="45" y="97" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#53617E" text-anchor="start">UTC / local time</text><text x="45" y="127" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#53617E" text-anchor="start">Place + options</text><path d="M314,91 h20 m-6,-5 6,5 -6,5" fill="none" stroke="#5850CC" stroke-width="2"/><rect x="343" y="27" width="278" height="133" rx="12" fill="#FFFFFF" stroke="#D1D9EE"/><text x="361" y="62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#10172E" text-anchor="start">Rust core</text><text x="361" y="97" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#53617E" text-anchor="start">Swiss + rules</text><text x="361" y="127" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#53617E" text-anchor="start">One shared engine</text><path d="M630,91 h20 m-6,-5 6,5 -6,5" fill="none" stroke="#5850CC" stroke-width="2"/><rect x="659" y="27" width="278" height="133" rx="12" fill="#FFFFFF" stroke="#D1D9EE"/><text x="677" y="62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#10172E" text-anchor="start">Payload</text><text x="677" y="97" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#53617E" text-anchor="start">JSON + metadata</text><text x="677" y="127" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill