<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="555" viewBox="0 0 1200 555"><text x="600" y="25.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172B3A">Ví dụ luồng tính một lá số natal</text><rect x="25" y="65" width="340" height="115" rx="10" fill="#F0F4F7" stroke="#40576A" stroke-width="2"/><text x="195.0" y="91.45" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">1. Nhận đầu vào</text><text x="195.0" y="122.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">Ngày giờ, nơi sinh,</text><text x="195.0" y="153.55" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">múi giờ, tùy chọn</text><rect x="430" y="65" width="340" height="115" rx="10" fill="#F0F4F7" stroke="#40576A" stroke-width="2"/><text x="600.0" y="91.45" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">2. Kiểm tra thời gian</text><text x="600.0" y="122.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">Xác định đúng thời điểm;</text><text x="600.0" y="153.55" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">từ chối giờ chưa rõ</text><rect x="835" y="65" width="340" height="115" rx="10" fill="#F0F4F7" stroke="#40576A" stroke-width="2"/><text x="1005.0" y="91.45" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">3. Tính thiên văn</text><text x="1005.0" y="122.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">Vị trí và nhà;</text><text x="1005.0" y="153.55" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">kiểm tra lỗi / cờ trả về</text><path d="M365,122 L430,122" stroke="#40576A" stroke-width="3"/><polygon points="430,122 419.4690092573155,127.75310646325043 419.4690092573155,116.24689353674957" fill="#40576A"/><path d="M770,122 L835,122" stroke="#40576A" stroke-width="3"/><polygon points="835,122 824.4690092573155,127.75310646325043 824.4690092573155,116.24689353674957" fill="#40576A"/><path d="M1005,180 L1005,270" stroke="#40576A" stroke-width="3"/><polygon points="1005,270 999.2468935367496,259.4690092573155 1010.7531064632504,259.4690092573155" fill="#40576A"/><rect x="835" y="272" width="340" height="105" rx="10" fill="#F0F4F7" stroke="#40576A" stroke-width="2"/><text x="1005.0" y="293.45" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">4. Tổ chức kết quả</text><text x="1005.0" y="324.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">Dữ kiện, phiên bản,</text><text x="1005.0" y="355.55" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">cảnh báo và lỗi</text><path d="M835,324 L770,324" stroke="#40576A" stroke-width="3"/><polygon points="770,324 780.5309907426845,318.24689353674955 780.5309907426845,329.75310646325045" fill="#40576A"/><rect x="430" y="272" width="340" height="105" rx="10" fill="#F0F4F7" stroke="#40576A" stroke-width="2"/><text x="600.0" y="293.45" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">5. Chọn cách chuyển</text><text x="600.0" y="324.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">JSON nguồn hoặc</text><text x="600.0" y="355.55" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">context theo nhu cầu</text><path d="M430,324 L365,324" stroke="#40576A" stroke-width="3"/><polygon points="365,324 375.5309907426845,318.24689353674955 375.5309907426845,329.75310646325045" fill="#40576A"/><rect x="25" y="272" width="340" height="105" rx="10" fill="#F0F4F7" stroke="#40576A" stroke-width="2"/><text x="195.0" y="293.45" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">6. Ứng dụng sử dụng</text><text x="195.0" y="324.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">Hiển thị, vẽ biểu đồ</text><text x="195.0" y="355.55" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">hoặc xử lý tiếp</text><text x="600" y="418.8" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172B3A">compact: giữ toàn bộ giá trị JSON → có thể giải nén.</text><text x="600" y="451.2" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172B3A">focused / budgeted: chọn phạm vi → công bố phần bị bỏ.</text><text x="600" y="515.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172B3A">Khi có lỗi, kiểm tra trạng thái trả về trước khi dùng dữ liệu.</text></svg>