<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570"><text x="600" y="26.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172B3A">Nhiều ngôn ngữ ứng dụng, một lõi tính toán dùng chung</text><rect x="30" y="65" width="360" height="86" rx="10" fill="#F0F4F7" stroke="#40576A" stroke-width="2"/><text x="210.0" y="92.475" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">JavaScript / TypeScript</text><text x="210.0" y="123.525" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">qua Node-API</text><path d="M210,151 L210,208" stroke="#40576A" stroke-width="3"/><polygon points="210,208 204.24689353674955,197.46900925731552 215.75310646325045,197.46900925731552" fill="#40576A"/><rect x="420" y="65" width="360" height="86" rx="10" fill="#F0F4F7" stroke="#40576A" stroke-width="2"/><text x="600.0" y="92.475" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">Python</text><text x="600.0" y="123.525" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">qua ctypes và C ABI</text><path d="M600,151 L600,208" stroke="#40576A" stroke-width="3"/><polygon points="600,208 594.2468935367496,197.46900925731552 605.7531064632504,197.46900925731552" fill="#40576A"/><rect x="810" y="65" width="360" height="86" rx="10" fill="#F0F4F7" stroke="#40576A" stroke-width="2"/><text x="990.0" y="92.475" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">.NET</text><text x="990.0" y="123.525" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">qua P/Invoke và C ABI</text><path d="M990,151 L990,208" stroke="#40576A" stroke-width="3"/><polygon points="990,208 984.2468935367496,197.46900925731552 995.7531064632504,197.46900925731552" fill="#40576A"/><rect x="30" y="210" width="1140" height="92" rx="10" fill="#F0F4F7" stroke="#40576A" stroke-width="2"/><text x="600.0" y="239.125" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#172B3A">Lõi Rust</text><text x="600.0" y="272.875" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#172B3A">Kiểm tra yêu cầu • tổ chức dữ kiện • tạo báo cáo • nén / giải nén</text><path d="M270,302 L270,360" stroke="#40576A" stroke-width="3"/><polygon points="270,360 264.24689353674955,349.4690092573155 275.75310646325045,349.4690092573155" fill="#40576A"/><path d="M930,302 L930,360" stroke="#40576A" stroke-width="3"/><polygon points="930,360 924.2468935367496,349.4690092573155 935.7531064632504,349.4690092573155" fill="#40576A"/><rect x="30" y="362" width="480" height="100" rx="10" fill="#F0F4F7" stroke="#40576A" stroke-width="2"/><text x="270.0" y="396.475" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">Xử lý thời gian</text><text x="270.0" y="427.525" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">Múi giờ → UTC → thang thời gian tính</text><rect x="690" y="362" width="480" height="100" rx="10" fill="#F0F4F7" stroke="#40576A" stroke-width="2"/><text x="930.0" y="396.475" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">Provider Swiss Ephemeris</text><text x="930.0" y="427.525" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">Tính vị trí thiên thể và nhà</text><text x="600" y="500.15" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172B3A">Ứng dụng nhận kết quả qua chính giao diện đã gọi.</text><text x="600" y="529.85" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172B3A">Các hộp mô tả trách nhiệm; mũi tên chỉ hướng gọi / sử dụng.</text></svg>