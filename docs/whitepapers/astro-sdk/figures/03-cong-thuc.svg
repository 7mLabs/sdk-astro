<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390"><text x="600" y="25.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172B3A">Mức giảm dung lượng là phần đã tiết kiệm so với ban đầu</text><rect x="25" y="72" width="360" height="93" rx="10" fill="#F0F4F7" stroke="#40576A" stroke-width="2"/><text x="205.0" y="100.95" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#172B3A">B: byte nguồn</text><text x="205.0" y="136.05" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#172B3A">20.014.085</text><text x="410" y="118.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="36" font-weight="400" fill="#172B3A">−</text><rect x="440" y="72" width="360" height="93" rx="10" fill="#F0F4F7" stroke="#40576A" stroke-width="2"/><text x="620.0" y="100.95" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#172B3A">C: byte sau nén</text><text x="620.0" y="136.05" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#172B3A">11.554.591</text><text x="825" y="118.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#172B3A">=</text><rect x="855" y="72" width="320" height="93" rx="10" fill="#F0F4F7" stroke="#40576A" stroke-width="2"/><text x="1015.0" y="100.95" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#172B3A">B − C: byte giảm</text><text x="1015.0" y="136.05" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#172B3A">8.459.494</text><text x="600" y="215.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#172B3A">R = 100 × (B − C) / B ≈ 42,27</text><text x="600" y="275.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172B3A">Giảm khoảng 42,27%; còn khoảng 57,73% dung lượng nguồn.</text><text x="600" y="322.475" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">C &gt; B → R âm: gói dữ liệu tăng kích thước.</text><text x="600" y="353.525" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172B3A">Đây là byte UTF-8; không phải số token hay phần trăm chi phí AI.</text></svg>