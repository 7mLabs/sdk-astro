[workspace]
members = ["crates/astro-core", "crates/astro-ffi", "crates/astro-node", "crates/astro-provider-swiss", "crates/astro-time", "crates/astro-render-svg", "crates/astro-sdk"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.83"
repository = "https://github.com/7mlabs/sdk-astro"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.109", features = ["raw_value", "float_roundtrip"] }
astro-core = { path = "crates/astro-core" }
